# Splunk Universal Forwarder inputs for WIN-VICTIM
# Location: C:\Program Files\SplunkUniversalForwarder\etc\system\local\inputs.conf

# Sysmon: explicit source/sourcetype so the Splunk Add-on for Sysmon recognizes the events
[WinEventLog://Microsoft-Windows-Sysmon/Operational]
disabled = 0
renderXml = true
source = XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
sourcetype = XmlWinEventLog
index = sysmon

# Logons, failed logons, privilege and account changes
[WinEventLog://Security]
disabled = 0
index = wineventlog

# Service installs (EID 7045), drivers, system events
[WinEventLog://System]
disabled = 0
index = wineventlog

# Application errors and context
[WinEventLog://Application]
disabled = 0
index = wineventlog

# PowerShell Script Block Logging (EID 4104), decoded script contents
[WinEventLog://Microsoft-Windows-PowerShell/Operational]
disabled = 0
index = wineventlog
